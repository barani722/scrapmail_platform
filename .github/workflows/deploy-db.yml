name: Deploy database migrations

# Staging is migrated automatically after a merge to main.
# Production waits for manual approval (GitHub environment "production"
# with required reviewers).
#
# Setup (GitHub > Settings > Environments), one environment each for
# "staging" and "production":
#   variable  SUPABASE_PROJECT_REF   project ref of that Supabase project
#   secret    SUPABASE_DB_PASSWORD   database password of that project
# and one repository secret:
#   secret    SUPABASE_ACCESS_TOKEN  Supabase personal access token
#
# A job is skipped while its environment has no SUPABASE_PROJECT_REF.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: echo "ready=${{ env.PROJECT_REF != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6.1.0
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Push migrations
        if: steps.config.outputs.ready == 'true'
        run: |
          pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --linked --yes
      - name: Not configured yet
        if: steps.config.outputs.ready != 'true'
        run: echo "::notice::Staging Supabase project not configured; skipped."

  production:
    name: Migrate production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: echo "ready=${{ env.PROJECT_REF != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6.1.0
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Push migrations
        if: steps.config.outputs.ready == 'true'
        run: |
          pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --linked --yes
      - name: Not configured yet
        if: steps.config.outputs.ready != 'true'
        run: echo "::notice::Production Supabase project not configured; skipped."
